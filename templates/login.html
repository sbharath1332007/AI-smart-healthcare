{% extends "base.html" %}

{% block title %}Sign In - AI Smart Healthcare{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-500 text-white mx-auto flex items-center justify-center shadow-md shadow-brand-500/20">
                <i data-lucide="user" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Patient Portal Login</h2>
            <p class="text-xs text-slate-500">Sign in to access your health consultations and care plans</p>
        </div>

        <form method="POST" action="/auth/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username / Client ID</label>
                <input type="text" name="username" required autofocus placeholder="e.g. bharath_s"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-600/20 transition-all flex items-center justify-center">
                <i data-lucide="log-in" class="w-4 h-4 mr-2"></i> Sign In
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            <p>New to AI Smart Healthcare? <a href="/auth/register" class="text-brand-600 font-bold hover:underline">Create an Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
