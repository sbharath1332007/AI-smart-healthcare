{% extends "base.html" %}

{% block title %}Create Account - AI Smart Healthcare{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 text-white mx-auto flex items-center justify-center shadow-md shadow-brand-500/20">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Your Account</h2>
            <p class="text-xs text-slate-500">Enter your details to personalize your health and diet plans</p>
        </div>

        <form method="POST" action="/auth/register" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full Legal Name</label>
                <input type="text" name="full_name" required placeholder="e.g. Bharath S"
                       value="{{ request.form.get('full_name', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username / Client ID</label>
                <input type="text" name="username" required placeholder="e.g. bharath_s"
                       value="{{ request.form.get('username', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Age</label>
                    <input type="number" name="age" placeholder="e.g. 28" min="1" max="120"
                           value="{{ request.form.get('age', '') }}"
                           class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Biological Sex</label>
                    <select name="gender" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <option value="Not Specified">Select...</option>
                        <option value="Male" {% if request.form.get('gender') == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if request.form.get('gender') == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if request.form.get('gender') == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Pre-existing Medical Conditions</label>
                <input type="text" name="preexisting" placeholder="e.g. None, Asthma, Diabetes"
                       value="{{ request.form.get('preexisting', '') }}"
                       class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 rounded-xl font-bold text-white bg-gradient-to-r from-brand-600 to-cyan-600 hover:from-brand-700 hover:to-cyan-700 shadow-md shadow-brand-600/20 transition-all flex items-center justify-center">
                <i data-lucide="user-plus" class="w-4 h-4 mr-2"></i> Create Account
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            <p>Already have an account? <a href="/auth/login" class="text-brand-600 font-bold hover:underline">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
